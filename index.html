<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>股票記帳</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>股票記帳</h1></header>
  <main>
    <section class="card">
      <h2>新增交易</h2>
      <form id="trade-form">
        <label>日期 <input type="date" name="date" required></label>
        <label>股票代號 <input name="code" required placeholder="2330"></label>
        <label>股票名稱 <input name="name" placeholder="台積電"></label>
        <label>買 / 賣
          <select name="side">
            <option value="buy">買進</option>
            <option value="sell">賣出</option>
          </select>
        </label>
        <label>股數 <input type="number" name="shares" min="1" step="1" required></label>
        <label>成交價 <input type="number" name="price" min="0" step="0.01" required></label>
        <label>手續費 <input type="number" name="fee" min="0" step="1" placeholder="自動計算"></label>
        <label>交易稅 <input type="number" name="tax" min="0" step="1" placeholder="自動計算"></label>
        <button type="submit">新增</button>
      </form>
      <p class="hint">手續費預設 0.1425%（最低 20 元），賣出交易稅 0.3%；留空即自動計算。</p>
    </section>

    <section class="card">
      <h2>股票統計</h2>
      <div class="table-wrap">
        <table id="stats">
          <thead>
            <tr>
              <th>代號</th><th>名稱</th><th>持有股數</th><th>平均成本</th><th>持有成本</th>
              <th>現價</th><th>市值</th><th>未實現損益</th><th>已實現損益</th><th>交易次數</th>
            </tr>
          </thead>
          <tbody></tbody>
          <tfoot></tfoot>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>交易紀錄</h2>
      <div class="table-wrap">
        <table id="trades">
          <thead>
            <tr><th>日期</th><th>代號</th><th>名稱</th><th>買賣</th><th>股數</th><th>價格</th><th>手續費</th><th>交易稅</th><th>金額</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="stats.js"></script>
  <script src="app.js"></script>
</body>
</html>
